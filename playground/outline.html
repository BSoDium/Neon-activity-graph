<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Outline colours</title>
    <style>
      body { margin: 0; font: 12px/1.3 system-ui, sans-serif; }
      .theme { padding: 20px 24px; }
      .theme.light { background: #f6f6f4; color: #1a1a1a; }
      .theme.dark { background: #0b0b0e; color: #e8e8ea; }
      h2 { margin: 0 0 12px; font-size: 14px; }
      .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: flex-start; }
      .row > b { width: 62px; font-weight: 500; opacity: .6; padding-top: 22px; }
      figure { margin: 0; width: 74px; text-align: center; }
      figure svg { display: block; margin: 0 auto 4px; }
      figcaption { font-size: 10px; opacity: .7; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <script type="module">
      // The outline colour against the colours the graph really draws (the stock tones of both themes, and the palettes of the demo, plus greys), in both themes. "text" is the old outline (the page's text colour).
      import { invertedOutline, contrastRatio } from "../src/color";
      const CELLS = [
        ["top low", "#0a8f2c"], ["top high", "#00d63c"], ["bottom low", "#1658b8"], ["bottom high", "#1a8cff"],
        ["orig top", "#3ddc6a"], ["orig bottom", "#5aa9ff"], ["technicolor", "#ff3b6b"], ["technicolor", "#00c8ff"],
        ["ice", "#b9ecff"], ["sunset", "#ff8a1f"], ["sunset", "#c4128a"], ["mono", "#eeeef2"], ["mono", "#7f879c"],
        ["grey 25%", "#404040"], ["grey 50%", "#808080"], ["grey 75%", "#bfbfbf"],
      ];
      const mixWhite = (hex, k) => "#" + [1, 3, 5].map((i) => Math.round(parseInt(hex.slice(i, i + 2), 16) * (1 - k) + 255 * k).toString(16).padStart(2, "0")).join("");
      for (const [theme, bg, text] of [["light", "#f6f6f4", "#1a1a1a"], ["dark", "#0b0b0e", "#e8e8ea"]]) {
        const sec = document.createElement("section");
        sec.className = `theme ${theme}`;
        sec.innerHTML = `<h2>${theme} theme</h2>`;
        for (const mode of ["text", "inverted"]) {
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = `<b>${mode === "text" ? "before: text colour" : "after: inverted"}</b>`;
          for (const [name, hex] of CELLS) {
            // (the light theme's glass is a pale shell over its tone)
            const seen = theme === "light" ? mixWhite(hex, 0.55) : hex;
            const stroke = mode === "text" ? text : invertedOutline(seen, bg);
            const f = document.createElement("figure");
            f.innerHTML = `<svg width="56" height="56" viewBox="0 0 56 56"><rect x="6" y="6" width="44" height="44" rx="7" fill="${seen}"/>${mode === "text" ? "" : `<rect x="6" y="6" width="44" height="44" rx="7" fill="none" stroke="${bg}" stroke-width="4" opacity=".85"/>`}<rect x="6" y="6" width="44" height="44" rx="7" fill="none" stroke="${stroke}" stroke-width="1.5"/></svg><figcaption>${name}<br>${contrastRatio(stroke, seen).toFixed(1)} / ${contrastRatio(stroke, bg).toFixed(1)}</figcaption>`;
            row.append(f);
          }
          sec.append(row);
        }
        document.body.append(sec);
      }
    </script>
  </body>
</html>
